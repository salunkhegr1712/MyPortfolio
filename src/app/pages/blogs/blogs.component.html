<app-navbar></app-navbar>

<main class="blogs-page min-h-screen bg-gradient-to-br from-black via-slate-950 to-blue-950 pt-20 pb-16">
  <div 
    appPatterns 
    [intensity]="0.15" 
    class="pattern-container absolute inset-0 z-0 pointer-events-none">
  </div>

  <div class="container relative z-10 mx-auto px-6 md:px-12 lg:px-16 max-w-7xl">
    
    <!-- Hero Header -->
    <header class="mb-12 mt-8">
      <h1 class="text-4xl md:text-5xl font-bold text-white mb-4">Blog</h1>
      <p class="text-lg text-gray-300 max-w-2xl">
        Insights on backend development, data engineering, and building scalable systems.
      </p>
    </header>

    <!-- Blogs Grid -->
    <section 
      class="blogs-grid grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" 
      aria-label="Blog posts list"
      *ngIf="blogs$ | async as blogsContent">
      
      <article
        *ngFor="let blog of blogsContent.blogs; trackBy: trackByBlogId"
        [routerLink]="['/blogs', blog.id]"
        class="blog-card bg-gray-800 rounded-lg overflow-hidden border border-gray-700 hover:border-blue-500 transition-all duration-200 cursor-pointer focus-within:ring-2 focus-within:ring-blue-500 focus-within:ring-offset-2 focus-within:ring-offset-gray-900 group"
        tabindex="0"
        [attr.aria-label]="'Blog post: ' + blog.title">
        
        <!-- Blog Image -->
        <div class="blog-image aspect-video bg-gray-700 relative overflow-hidden">
          <img
            [src]="blog.image"
            [alt]="blog.title"
            loading="lazy"
            class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          
          <!-- Fallback placeholder if image fails to load -->
          <div
            class="hidden w-full h-full items-center justify-center bg-gradient-to-br from-blue-900 to-gray-800">
            <svg
              class="w-16 h-16 text-gray-600"
              fill="currentColor"
              viewBox="0 0 24 24"
              aria-hidden="true">
              <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
            </svg>
          </div>
        </div>

        <!-- Blog Content -->
        <div class="p-6">
          <!-- Meta Info -->
          <div class="flex items-center gap-3 mb-3 text-sm text-gray-400">
            <time [attr.datetime]="blog.date">{{ blog.date | date: 'MMM d, yyyy' }}</time>
            <span class="w-1 h-1 bg-gray-600 rounded-full"></span>
            <span>{{ blog.readTime }} min read</span>
          </div>

          <h2 class="text-xl font-semibold text-white mb-2 group-hover:text-blue-400 transition-colors">
            {{ blog.title }}
          </h2>
          
          <p class="text-gray-300 text-sm mb-4 line-clamp-3">{{ blog.summary }}</p>

          <!-- Tags -->
          <div class="tech-tags flex flex-wrap gap-2 mb-4">
            <span
              *ngFor="let tag of blog.tags"
              class="inline-block px-3 py-1 bg-gray-700 text-gray-300 text-xs rounded-full">
              {{ tag }}
            </span>
          </div>

          <!-- Read More Link -->
          <div class="flex items-center text-blue-500 text-sm font-medium group-hover:text-blue-400 transition-colors">
            <span>Read more</span>
            <svg class="w-4 h-4 ml-1 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </div>
        </div>
      </article>

      <!-- No results message -->
      <div
        *ngIf="blogsContent.blogs.length === 0"
        class="col-span-full text-center py-12 text-gray-400">
        <p class="text-lg">No blog posts available yet. Check back soon!</p>
      </div>
    </section>
  </div>
</main>
