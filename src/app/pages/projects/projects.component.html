<app-navbar></app-navbar>

<main class="projects-page min-h-screen bg-gradient-to-br from-black via-gray-950 to-blue-950 pt-20 pb-16">
  <div class="container mx-auto px-6 md:px-12 lg:px-16 max-w-7xl">
    
    <!-- Hero Header -->
    <header class="mb-12 mt-8">
      <h1 class="text-4xl md:text-5xl font-bold text-white mb-4">Projects</h1>
      <p class="text-lg text-gray-300 max-w-2xl">
        Explore my work in data engineering, backend development, and full-stack applications.
      </p>
    </header>

    <!-- Filter Bar -->
    <section class="filter-bar mb-8" aria-label="Filter projects by technology">
      <div class="flex flex-wrap gap-2">
        <button
          *ngFor="let tech of allTechTags"
          (click)="toggleTechFilter(tech)"
          [class.active]="isTechSelected(tech)"
          class="filter-chip px-4 py-2 rounded-full text-sm font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-900 focus:ring-blue-500"
          [class.bg-blue-600]="isTechSelected(tech)"
          [class.text-white]="isTechSelected(tech)"
          [class.bg-gray-700]="!isTechSelected(tech)"
          [class.text-gray-300]="!isTechSelected(tech)"
          [class.hover:bg-gray-600]="!isTechSelected(tech)"
          [attr.aria-pressed]="isTechSelected(tech)"
          type="button">
          {{ tech }}
        </button>
      </div>
    </section>

    <!-- Projects Grid -->
    <section class="projects-grid grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" aria-label="Projects list">
      <article
        *ngFor="let project of filteredProjects; trackBy: trackByProjectId"
        class="project-card bg-gray-800 rounded-lg overflow-hidden border border-gray-700 hover:border-blue-500 transition-all duration-200 focus-within:ring-2 focus-within:ring-blue-500 focus-within:ring-offset-2 focus-within:ring-offset-gray-900"
        tabindex="0"
        [attr.aria-label]="'Project: ' + project.title">
        
        <!-- Project Image -->
        <div class="project-image aspect-video bg-gray-700 relative overflow-hidden">
          <img
            *ngIf="project.image"
            [src]="project.image"
            [alt]="project.title + ' screenshot'"
            loading="lazy"
            class="w-full h-full object-cover">
          
          <!-- Fallback SVG placeholder if no image -->
          <svg
            *ngIf="!project.image"
            class="w-full h-full text-gray-600"
            fill="currentColor"
            viewBox="0 0 24 24"
            aria-hidden="true">
            <path d="M4 5h16a1 1 0 011 1v12a1 1 0 01-1 1H4a1 1 0 01-1-1V6a1 1 0 011-1zm11.5 4.5a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0zM5 15l3-3 2 2 3-4 4 5H5z"/>
          </svg>
        </div>

        <!-- Project Content -->
        <div class="p-6">
          <h2 class="text-xl font-semibold text-white mb-2">{{ project.title }}</h2>
          
          <p class="text-gray-300 text-sm mb-4">{{ project.summary }}</p>

          <!-- Tech Tags -->
          <div class="tech-tags flex flex-wrap gap-2 mb-4">
            <span
              *ngFor="let tech of project.tech"
              class="inline-block px-3 py-1 bg-gray-700 text-gray-300 text-xs rounded-full">
              {{ tech }}
            </span>
          </div>

          <!-- CTA Buttons -->
          <div class="flex gap-3" role="group" [attr.aria-label]="'Actions for ' + project.title">
            <a
              *ngIf="project.demoUrl"
              [href]="project.demoUrl"
              target="_blank"
              rel="noopener noreferrer"
              class="flex-1 inline-flex items-center justify-center px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-gray-800"
              [attr.aria-label]="'View live demo of ' + project.title">
              View Demo
            </a>
            <a
              *ngIf="project.repoUrl"
              [href]="project.repoUrl"
              target="_blank"
              rel="noopener noreferrer"
              class="flex-1 inline-flex items-center justify-center px-4 py-2 border border-gray-600 hover:bg-gray-700 text-gray-300 text-sm font-medium rounded transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 focus:ring-offset-gray-800"
              [attr.aria-label]="'View source code of ' + project.title + ' on GitHub'">
              Source
            </a>
          </div>
        </div>
      </article>

      <!-- No results message -->
      <div
        *ngIf="filteredProjects.length === 0"
        class="col-span-full text-center py-12 text-gray-400">
        <p class="text-lg">No projects found with the selected technology.</p>
        <button
          (click)="selectedTech = null"
          class="mt-4 text-blue-500 hover:text-blue-400 underline focus:outline-none focus:ring-2 focus:ring-blue-500 rounded"
          type="button">
          Clear filter
        </button>
      </div>
    </section>
  </div>
</main>
