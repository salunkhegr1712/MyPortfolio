<app-navbar></app-navbar>

<main class="about-page min-h-screen bg-gradient-to-br from-black via-gray-950 to-blue-950 pt-20 pb-16">
  <div class="container mx-auto px-6 md:px-12 lg:px-16 max-w-5xl">

    <!-- Hero Section -->
    <article class="hero-section mb-16 mt-8">
      <div class="flex flex-col md:flex-row items-center md:items-start gap-8">
        
        <!-- Headshot -->
        <div class="headshot-container flex-shrink-0">
          <div class="w-32 h-32 md:w-40 md:h-40 rounded-full bg-gray-700 overflow-hidden border-4 border-blue-500">
            <img
              *ngIf="headshot"
              [src]="headshot"
              [alt]="name + ' photo'"
              class="w-full h-full object-cover">
            
            <!-- Fallback icon if no headshot -->
            <div *ngIf="!headshot" class="w-full h-full flex items-center justify-center text-gray-500">
              <svg class="w-20 h-20" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
              </svg>
            </div>
          </div>
        </div>

        <!-- Bio -->
        <div class="flex-1 text-center md:text-left">
          <h1 class="text-4xl md:text-5xl font-bold text-white mb-4">{{ name }}</h1>
          <p class="text-lg text-gray-300 leading-relaxed mb-6">{{ bio }}</p>
          
          <!-- CTA Buttons -->
          <div class="flex flex-wrap gap-4 justify-center md:justify-start">
            <a
              *ngIf="hasResume"
              [href]="resumePath"
              download
              class="inline-flex items-center px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-gray-900"
              aria-label="Download resume PDF">
              Download Resume
            </a>
            <button
              (click)="scrollToContact()"
              class="inline-flex items-center px-6 py-3 border border-gray-600 hover:bg-gray-700 text-gray-300 font-medium rounded transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 focus:ring-offset-gray-900"
              type="button">
              Contact Me
            </button>
          </div>
        </div>
      </div>
    </article>

    <!-- Technologies Section -->
    <section class="technologies-section mb-16">
      <h2 class="text-2xl font-bold text-white mb-6">Core Technologies</h2>
      <div class="flex flex-wrap gap-3">
        <span
          *ngFor="let tech of technologies; trackBy: trackByTech"
          class="inline-block px-4 py-2 bg-gray-800 border border-gray-700 text-gray-300 rounded-lg text-sm font-medium">
          {{ tech }}
        </span>
      </div>
    </section>

    <!-- Timeline Section -->
    <section class="timeline-section">
      <h2 class="text-2xl font-bold text-white mb-8">Professional Journey</h2>
      
      <div class="timeline-container relative">
        <!-- Vertical line -->
        <div class="timeline-line absolute left-0 md:left-4 top-0 bottom-0 w-0.5 bg-gray-700" aria-hidden="true"></div>

        <div class="space-y-8">
          <article
            *ngFor="let entry of timeline; trackBy: trackByYear"
            class="timeline-entry relative pl-8 md:pl-12">
            
            <!-- Timeline dot -->
            <div class="timeline-dot absolute left-0 md:left-4 top-1 w-3 h-3 bg-blue-500 rounded-full -translate-x-[5px]" aria-hidden="true"></div>

            <div class="bg-gray-800 border border-gray-700 rounded-lg p-6 hover:border-blue-500 transition-colors duration-200">
              <time class="text-sm text-blue-400 font-semibold" [attr.datetime]="entry.year">
                {{ entry.year }}
              </time>
              <h3 class="text-xl font-bold text-white mt-2 mb-3">{{ entry.role }}</h3>
              <p class="text-gray-300 leading-relaxed">{{ entry.description }}</p>
            </div>
          </article>
        </div>
      </div>
    </section>

    <!-- Contact CTA Section -->
    <section id="contact-section" class="contact-cta-section mt-16 p-8 bg-gray-800 border border-gray-700 rounded-lg text-center">
      <h2 class="text-2xl font-bold text-white mb-4">Let's Work Together</h2>
      <p class="text-gray-300 mb-6">
        Interested in collaborating or have a project in mind? Get in touch!
      </p>
      <button
        (click)="scrollToContact()"
        class="inline-flex items-center px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-gray-800"
        type="button">
        Contact Me
      </button>
    </section>
  </div>
</main>
