<div 
  *ngIf="showNotification"
  class="fixed bottom-6 right-6 z-50 max-w-sm animate-slide-in">
  
  <div class="relative bg-white/10 backdrop-blur-xl rounded-2xl border border-white/20 shadow-2xl p-5
              before:absolute before:inset-0 before:rounded-2xl before:bg-gradient-to-br before:from-white/20 before:to-transparent before:opacity-50
              after:absolute after:inset-0 after:rounded-2xl after:bg-gradient-to-tl after:from-cyan-500/10 after:via-transparent after:to-blue-500/10">
    
    <!-- Close button -->
    <button
      (click)="hideNotification()"
      class="absolute top-3 right-3 z-20 text-gray-400 hover:text-white transition-colors duration-200 focus:outline-none"
      aria-label="Close notification"
      type="button">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>

    <div class="relative z-10">
      <!-- Icon with bell -->
      <div class="flex items-start gap-4 mb-3">
        <div class="flex-shrink-0 w-10 h-10 bg-gradient-to-br from-blue-500 to-cyan-500 rounded-xl flex items-center justify-center animate-bounce">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
          </svg>
        </div>

        <div class="flex-1 pr-6">
          <h3 class="text-white font-semibold text-base mb-1">Let's Connect!</h3>
          <p class="text-gray-300 text-sm">Have a project in mind? Get in touch and let's work together!</p>
        </div>
      </div>

      <!-- Action button -->
      <button
        (click)="navigateToContact()"
        class="w-full mt-3 px-4 py-2.5 bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-700 hover:to-cyan-700 text-white font-medium rounded-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-gray-900 transform hover:scale-105"
        type="button">
        Contact Me
      </button>
    </div>
  </div>
</div>
