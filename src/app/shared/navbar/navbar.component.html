<nav class="fixed top-3 left-1/2 -translate-x-1/2 z-50 w-[94%] sm:w-auto max-w-full pointer-events-auto" aria-label="Primary navigation">
  <div
    class="relative bg-slate-900/20 backdrop-blur-md rounded-full border border-white/15 shadow-lg shadow-black/40
           px-3 sm:px-6 py-1.5 sm:py-1.5">

    <div class="relative z-10 flex items-center justify-between gap-2 sm:gap-5">
      <!-- mobile hamburger -->
      <button
        type="button"
        class="sm:hidden inline-flex items-center justify-center p-2 rounded-md text-gray-200 focus:outline-none focus:ring-2 focus:ring-white/40"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="mobileOpen"
        aria-controls="mobile-menu">
        <span class="sr-only">{{ mobileOpen ? 'Close menu' : 'Open menu' }}</span>
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="mobileOpen ? closeIconPath : menuIconPath"></path>
        </svg>
      </button>

      <!-- Navigation Links -->
      <ul class="hidden sm:flex items-center gap-2 sm:gap-4" role="menubar">
        <li role="none" *ngFor="let link of navLinks">
          <a 
            [routerLink]="link.route"
            routerLinkActive="text-white font-semibold border-b-2 border-green-400 drop-shadow-[0_2px_6px_rgba(0,150,150,0.45)]"
            class="inline-flex items-center justify-center px-3 sm:px-6 py-2 text-base sm:text-lg nav-link text-gray-100 drop-shadow-[0_1px_4px_rgba(0,0,0,0.75)] hover:text-white hover:border-b-2 hover:border-white transition-all duration-200 outline-none border-b-2 border-transparent"
            role="menuitem">
            {{ link.label }}
          </a>
        </li>
      </ul>
    </div>
  </div>

  <!-- Mobile menu sheet -->
  <div
    id="mobile-menu"
    class="sm:hidden"
    *ngIf="mobileOpen">
    <div class="fixed inset-0 z-40 bg-black/70 backdrop-blur-md" (click)="closeMobileMenu()"></div>
    <div class="fixed inset-x-0 top-16 z-50 flex justify-center px-4">
      <div class="w-full max-w-md bg-black/80 rounded-lg p-4" (click)="$event.stopPropagation()">
        <ul class="flex flex-col gap-3">
          <li role="none" *ngFor="let link of navLinks">
            <a
              [routerLink]="link.route"
              routerLinkActive="bg-white/10 text-white"
              class="block w-full rounded-md px-4 py-3 text-base text-gray-100 bg-white/5 hover:bg-white/15 focus:outline-none focus:ring-2 focus:ring-white/30"
              role="menuitem"
              (click)="handleMobileLinkClick()">
              {{ link.label }}
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>
  <div class="h-4 sm:h-6" aria-hidden="true"></div>
</nav>
