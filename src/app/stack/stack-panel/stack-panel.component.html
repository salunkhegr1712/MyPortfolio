<!-- Full Panel View -->
<div *ngIf="!collapsed" 
     class="stack-panel bg-white rounded-lg shadow-xl overflow-hidden transition-transform duration-200"
     [style.width.px]="state.config.width || 420"
     role="region"
     [attr.aria-label]="state.config.title">
  
  <!-- Panel Header -->
  <div class="panel-header flex items-center justify-between px-4 py-3 bg-gray-100 border-b border-gray-200"
       tabindex="0"
       [attr.aria-label]="'Panel: ' + state.config.title">
    <h3 class="text-lg font-semibold text-gray-800 truncate flex-1">
      {{ state.config.title }}
    </h3>

    <div class="flex items-center gap-2 ml-4">
      <!-- Pin Button -->
      <button *ngIf="state.config.pinnable"
              type="button"
              (click)="onPinToggle()"
              class="p-2 rounded hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-teal-500 transition-colors"
              [class.text-teal-600]="state.pinned"
              [class.text-gray-500]="!state.pinned"
              [attr.aria-label]="state.pinned ? 'Unpin panel' : 'Pin panel'"
              [attr.aria-pressed]="state.pinned">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
          <path *ngIf="state.pinned" d="M10 2a1 1 0 011 1v1.323l3.954 1.582 1.599-.8a1 1 0 01.894 1.79l-1.233.616 1.738 5.42a1 1 0 01-.285 1.05A3.989 3.989 0 0115 15a3.989 3.989 0 01-2.667-1.019 1 1 0 01-.285-1.05l1.715-5.349L11 6.477V16h2a1 1 0 110 2H7a1 1 0 110-2h2V6.477L6.237 7.582l1.715 5.349a1 1 0 01-.285 1.05A3.989 3.989 0 015 15a3.989 3.989 0 01-2.667-1.019 1 1 0 01-.285-1.05l1.738-5.42-1.233-.617a1 1 0 01.894-1.788l1.599.799L9 4.323V3a1 1 0 011-1z"/>
          <path *ngIf="!state.pinned" fill-rule="evenodd" d="M10 2a1 1 0 011 1v1.323l3.954 1.582 1.599-.8a1 1 0 01.894 1.79l-1.233.616 1.738 5.42a1 1 0 01-.285 1.05A3.989 3.989 0 0115 15a3.989 3.989 0 01-2.667-1.019 1 1 0 01-.285-1.05l1.715-5.349L11 6.477V16h2a1 1 0 110 2H7a1 1 0 110-2h2V6.477L6.237 7.582l1.715 5.349a1 1 0 01-.285 1.05A3.989 3.989 0 015 15a3.989 3.989 0 01-2.667-1.019 1 1 0 01-.285-1.05l1.738-5.42-1.233-.617a1 1 0 01.894-1.788l1.599.799L9 4.323V3a1 1 0 011-1z" clip-rule="evenodd" opacity="0.4"/>
        </svg>
      </button>

      <!-- Close Button -->
      <button *ngIf="state.config.closable"
              type="button"
              (click)="onClose()"
              class="p-2 rounded hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-teal-500 text-gray-500 hover:text-gray-700 transition-colors"
              aria-label="Close panel">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Panel Content -->
  <div class="panel-content p-4 overflow-y-auto max-h-96">
    <!-- TemplateRef content -->
    <ng-container *ngIf="isTemplateRef()">
      <ng-container *ngTemplateOutlet="$any(state.config.content)"></ng-container>
    </ng-container>

    <!-- String content -->
    <div *ngIf="!isTemplateRef() && getStringContent()" 
         class="text-gray-700">
      {{ getStringContent() }}
    </div>

    <!-- Fallback if no content -->
    <div *ngIf="!state.config.content" class="text-gray-400 italic">
      No content provided
    </div>
  </div>
</div>

<!-- Badge/Collapsed View -->
<div *ngIf="collapsed"
     class="stack-badge bg-gray-800 text-white px-4 py-2 rounded-md shadow-md cursor-pointer hover:bg-gray-700 transition-colors"
     (click)="onReopen()"
     role="button"
     tabindex="0"
     (keydown.enter)="onReopen()"
     (keydown.space)="onReopen()"
     [attr.aria-label]="'Reopen panel: ' + state.config.title">
  <div class="flex items-center justify-between">
    <span class="text-sm font-medium truncate">{{ state.config.title }}</span>
    <svg class="w-4 h-4 ml-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
    </svg>
  </div>
</div>
